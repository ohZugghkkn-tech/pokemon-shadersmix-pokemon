[shader]
name=Pokemon ShaderMix
author=ohZugghkkn-tech
description=Single-pass pixel-art edge scaling, bevel highlights, and color adjustment.
passes=1

[pass.0]
fragmentShader=pokemon-shadermix.fs
blend=1
width=-3
height=-3

[pass.0.uniform.edge_threshold]
type=float
default=0.08
min=0.01
max=0.30
readableName=Edge Match Threshold

[pass.0.uniform.bevel_level]
type=float
default=0.18
min=0.0
max=0.5
readableName=Bevel Level

[pass.0.uniform.saturation]
type=float
default=1.0
min=0.0
max=2.0
readableName=Saturation

[pass.0.uniform.contrast]
type=float
default=1.0
min=0.0
max=2.0
readableName=Contrast

[pass.0.uniform.luminance]
type=float
default=1.0
min=0.0
max=2.0
readableName=Luminance

[pass.0.uniform.target_gamma]
type=float
default=2.2
min=0.5
max=4.0
readableName=Target Gamma

[pass.0.uniform.red_level]
type=float
default=1.0
min=0.0
max=2.0
readableName=Red Channel

[pass.0.uniform.green_level]
type=float
default=1.0
min=0.0
max=2.0
readableName=Green Channel

[pass.0.uniform.blue_level]
type=float
default=1.0
min=0.0
max=2.0
readableName=Blue Channel
